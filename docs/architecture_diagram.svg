      <text x="20" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">⑤ Trust &amp; Governance Panel</text>
      <text x="20" y="48" font-family="sans-serif" font-size="11" fill="#a7f3d0">• 生体写真RAM消去証明書</text>
      <text x="20" y="68" font-family="sans-serif" font-size="11" fill="#a7f3d0">• 骨格歪曲率 0.00% 監査適合証</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 領域 2: Google Cloud Run (Backend & Agent Core Layer) -->
  <!-- ============================================================ -->
  <g id="CloudRunLayer" transform="translate(430, 150)">
    <!-- 外枠 -->
    <rect width="640" height="690" rx="24" fill="url(#cloudRunGrad)" stroke="#4285f4" stroke-width="2.5" filter="url(#dropShadow)" />
    
    <!-- Cloud Run ヘッダーバー -->
    <path d="M 0 24 Q 0 0 24 0 L 616 0 Q 640 0 640 24 L 640 54 L 0 54 Z" fill="#1e3a8a" opacity="0.8" />
    <circle cx="35" cy="27" r="14" fill="#4285f4" />
    <text x="35" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">CR</text>
    <text x="60" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff">
      Google Cloud Run :: Agent Gateway &amp; Orchestrator
    </text>
    <text x="615" y="34" font-family="sans-serif" font-size="12" fill="#93c5fd" text-anchor="end">
      Region: asia-northeast1 (待機コスト0円)
    </text>

    <!-- サブレイヤー 1: Security & Governance Guardrail -->
    <g transform="translate(30, 75)">
      <rect width="580" height="90" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="20" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399">
        ① Security &amp; Ethics Guardrail (N-G01 / N-G02)
      </text>
      <text x="20" y="52" font-family="sans-serif" font-size="12" fill="#cbd5e1">
