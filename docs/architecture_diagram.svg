      </text>
      <text x="20" y="90" font-family="sans-serif" font-size="11" fill="#0284c7">
        • 全推論ステップのEnd-to-Endレイテンシ追跡（1ループ約4秒）
      </text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 領域 3: External Services & Support Sponsors -->
