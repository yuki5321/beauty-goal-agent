    <!-- コンポーネント群 -->
    <g transform="translate(20, 70)">
      <rect width="280" height="85" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f43f5e">① Goal Selection &amp; Photo</text>
      <text x="20" y="52" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 中顔面短縮 / 小顔 / 目元縦幅</text>
      <text x="20" y="70" font-family="sans-serif" font-size="11" fill="#94a3b8">• 生体顔写真の安全アップロード</text>
    </g>

    <g transform="translate(20, 175)">
      <rect width="280" height="110" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#22d3ee">② Real-time OODA Stream</text>
      <text x="20" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Server-Sent Events (SSE) 受信</text>
      <text x="20" y="70" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Thought / Action / Critic 可視化</text>
      <text x="20" y="90" font-family="sans-serif" font-size="11" fill="#a5f3fc">• スコア推移グラフ (72% → 88%)</text>
