      <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c084fc">③ Before/After &amp; Recipes</text>
      <text x="20" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1">• 左右ドラッグ比較スライダー</text>
      <text x="20" y="70" font-family="sans-serif" font-size="11" fill="#cbd5e1">• 市販コスメ品番処方箋（KATE等）</text>
      <text x="20" y="90" font-family="sans-serif" font-size="11" fill="#e9d5ff">• 処方箋シート画像(PNG)保存</text>
    </g>

    <g transform="translate(20, 435)">
      <rect width="280" height="95" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f472b6">④ Human-in-the-Loop Chat</text>
      <text x="20" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1">• ユーザー対話型微調整Replan</text>
      <text x="20" y="72" font-family="sans-serif" font-size="11" fill="#cbd5e1">• 「リップ薄め」「前髪なし」要望</text>
    </g>

    <g transform="translate(20, 550)">
