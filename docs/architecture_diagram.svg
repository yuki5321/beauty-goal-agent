<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- グラデーション定義 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cloudRunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="youcamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>

    <!-- 影効果 -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- マーカー (矢印) -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ec4899" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- 全体背景 -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- 背景グリッド装飾 -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="150" x2="1600" y2="150" />
    <line x1="0" y1="300" x2="1600" y2="300" />
    <line x1="0" y1="450" x2="1600" y2="450" />
    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="750" x2="1600" y2="750" />
    <line x1="200" y1="0" x2="200" y2="900" />
    <line x1="400" y1="0" x2="400" y2="900" />
    <line x1="600" y1="0" x2="600" y2="900" />
    <line x1="800" y1="0" x2="800" y2="900" />
    <line x1="1000" y1="0" x2="1000" y2="900" />
    <line x1="1200" y1="0" x2="1200" y2="900" />
    <line x1="1400" y1="0" x2="1400" y2="900" />
  </g>

  <!-- ============================================================ -->
  <!-- ヘッダーセクション -->
  <!-- ============================================================ -->
  <g id="Header">
    <text x="60" y="65" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" fill="url(#titleGrad)" letter-spacing="1">
      Beauty Goal Agent :: System Architecture
    </text>
    <text x="60" y="98" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#94a3b8">
      第5回 Agentic AI Hackathon with Google Cloud  |  Google Cloud Run × Gemini 2.0 / 1.5 × YouCam MCP
    </text>
    
    <!-- ガバナンスバッジ -->
    <g transform="translate(1080, 45)">
      <rect width="460" height="42" rx="21" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.9" />
      <text x="230" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">
        🛡️ Responsible AI &amp; Governance Verified (N-G01〜N-G04)
      </text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 領域 1: Frontend (Client Layer) -->
  <!-- ============================================================ -->
  <g id="FrontendLayer" transform="translate(60, 150)">
    <rect width="320" height="690" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#dropShadow)" />
    <rect width="320" height="50" rx="24" fill="#1e293b" />
    <text x="160" y="32" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      💻 Client Application (Web / Mobile)
