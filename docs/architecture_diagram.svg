<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','WenQuanYi Zen Hei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0b0f19"/>

  <!-- Title -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="#f472b6">Beauty Goal Agent — System Architecture</text>
  <text x="40" y="84" font-size="16" fill="#94a3b8">第5回 Agentic AI Hackathon with Google Cloud ｜ Cloud Run × Gemini × YouCam API</text>

  <!-- ========== Client ========== -->
  <rect x="40" y="120" width="330" height="640" rx="18" fill="#111827" stroke="#334155"/>
  <text x="62" y="156" font-size="19" font-weight="700" fill="#f8fafc">ブラウザ（React + Vite）</text>

  <g font-size="14">
    <rect x="60" y="176" width="290" height="96" rx="12" fill="#1e293b"/>
    <text x="76" y="199" font-weight="700" fill="#fb7185">① Goal・写真の入力</text>
    <text x="76" y="221" fill="#cbd5e1">中顔面短縮 / 小顔 など</text>
    <text x="76" y="242" fill="#cbd5e1">アップロード or カメラ撮影</text>
    <text x="76" y="262" fill="#cbd5e1" font-size="13">前髪の系統（レディース / メンズ）を選択</text>

    <rect x="60" y="284" width="290" height="96" rx="12" fill="#1e293b"/>
    <text x="76" y="310" font-weight="700" fill="#22d3ee">② 思考ログ（SSE）</text>
    <text x="76" y="334" fill="#cbd5e1">OBSERVE … REPLAN を逐次表示</text>
    <text x="76" y="356" fill="#cbd5e1">要素別スコア・仮説の棄却</text>

    <rect x="60" y="392" width="290" height="118" rx="12" fill="#1e293b"/>
    <text x="76" y="418" font-weight="700" fill="#c084fc">③ Before / After と解析</text>
    <text x="76" y="442" fill="#cbd5e1">比較スライダー・環境光切り替え</text>
    <text x="76" y="464" fill="#cbd5e1">要素別評価・パラメータ6項目</text>
    <text x="76" y="486" fill="#cbd5e1">中顔面比率（参考値）</text>

    <rect x="60" y="522" width="290" height="96" rx="12" fill="#1e293b"/>
    <text x="76" y="548" font-weight="700" fill="#f472b6">④ レシピ・対話で微調整</text>
    <text x="76" y="572" fill="#cbd5e1">市販コスメ（検索確認済バッジ）</text>
    <text x="76" y="594" fill="#cbd5e1">PNG 保存・要望から再計画</text>

    <rect x="60" y="630" width="290" height="110" rx="12" fill="#1e293b"/>
    <text x="76" y="656" font-weight="700" fill="#34d399">⑤ ガバナンス表示</text>
    <text x="76" y="680" fill="#cbd5e1">監査証明書（N-G01〜N-G04）</text>
    <text x="76" y="702" fill="#cbd5e1">YouCam への送信と</text>
    <text x="76" y="724" fill="#cbd5e1">最大24時間保持を明示</text>
  </g>

  <!-- Client <-> Cloud Run -->
  <line x1="372" y1="330" x2="418" y2="330" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="418" y1="370" x2="372" y2="370" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="378" y="318" font-size="12" fill="#94a3b8">POST</text>
  <text x="380" y="392" font-size="12" fill="#94a3b8">SSE</text>

  <!-- ========== Cloud Run ========== -->
  <rect x="420" y="120" width="740" height="640" rx="18" fill="#0f1b33" stroke="#3b82f6" stroke-width="2"/>
  <text x="442" y="156" font-size="19" font-weight="700" fill="#ffffff">Google Cloud Run — FastAPI（1コンテナ・asia-northeast1）</text>
  <text x="442" y="180" font-size="13" fill="#93c5fd">/api/agent/optimize ・ /api/agent/feedback-replan ・ /api/session/purge</text>

  <g font-size="14">
    <!-- Guardrail -->
    <rect x="440" y="196" width="350" height="104" rx="12" fill="#052e2b" stroke="#10b981"/>
    <text x="456" y="222" font-weight="700" fill="#34d399">ガードレール（N-G01 / N-G02）</text>
    <text x="456" y="246" fill="#cbd5e1">容姿批判語・採点表現をブロック</text>
    <text x="456" y="268" fill="#cbd5e1">7項目を安全上限に補正</text>
    <text x="456" y="290" fill="#cbd5e1" font-size="13">（オーバーリップ ≤1.3・濃さ ≤90・変形なし）</text>

    <!-- Memory -->
    <rect x="800" y="196" width="340" height="104" rx="12" fill="#1e1b3a" stroke="#8b5cf6"/>
    <text x="816" y="222" font-weight="700" fill="#c4b5fd">写真はメモリ上のみ（N-G03）</text>
    <text x="816" y="246" fill="#cbd5e1">ディスク・DBへ保存しない</text>
    <text x="816" y="268" fill="#cbd5e1">セッション終了 / 300秒で破棄</text>

    <!-- Agent loop -->
    <rect x="440" y="314" width="700" height="318" rx="12" fill="#1f1020" stroke="#f472b6"/>
    <text x="456" y="342" font-weight="700" fill="#fb7185">自律エージェント（OODA + Replan、最大3回・85%で収束 / N-G04）</text>

    <rect x="456" y="360" width="214" height="80" rx="10" fill="#2a1630"/>
    <text x="468" y="384" font-weight="700" fill="#fbcfe8">1 OBSERVE</text>
    <text x="468" y="406" fill="#e2e8f0" font-size="13">YouCam 顔分析で</text>
    <text x="468" y="426" fill="#e2e8f0" font-size="13">三分割比率を計測</text>

    <rect x="680" y="360" width="214" height="80" rx="10" fill="#2a1630"/>
    <text x="692" y="384" font-weight="700" fill="#fbcfe8">2 ORIENT</text>
    <text x="692" y="406" fill="#e2e8f0" font-size="13">目標比率との差を確認</text>
    <text x="692" y="426" fill="#e2e8f0" font-size="13">3役（錯視・スタイル・安全）</text>

    <rect x="904" y="360" width="220" height="80" rx="10" fill="#2a1630"/>
    <text x="916" y="384" font-weight="700" fill="#fbcfe8">3 DECIDE</text>
    <text x="916" y="406" fill="#e2e8f0" font-size="13">Gemini が Plan を JSON で</text>
    <text x="916" y="426" fill="#e2e8f0" font-size="13">立案 → ガードレールで補正</text>

    <rect x="904" y="456" width="220" height="80" rx="10" fill="#2a1630"/>
    <text x="916" y="480" font-weight="700" fill="#fbcfe8">4 ACT</text>
    <text x="916" y="502" fill="#e2e8f0" font-size="13">YouCam で前髪 → メイク</text>
    <text x="916" y="522" fill="#e2e8f0" font-size="13">失敗時は内蔵シミュレータ</text>

    <rect x="680" y="456" width="214" height="80" rx="10" fill="#2a1630"/>
    <text x="692" y="480" font-weight="700" fill="#fbcfe8">5 EVALUATE</text>
    <text x="692" y="502" fill="#e2e8f0" font-size="13">Gemini が要素別に採点</text>
    <text x="692" y="522" fill="#e2e8f0" font-size="13">コードで重み付き平均</text>

    <rect x="456" y="456" width="214" height="80" rx="10" fill="#2a1630"/>
    <text x="468" y="480" font-weight="700" fill="#fbcfe8">6 REPLAN</text>
    <text x="468" y="502" fill="#e2e8f0" font-size="13">85%未満なら仮説を棄却</text>
    <text x="468" y="522" fill="#e2e8f0" font-size="13">Gemini が次の Plan へ（→3）</text>

    <!-- loop arrows -->
    <line x1="670" y1="400" x2="678" y2="400" stroke="#f472b6" stroke-width="2" marker-end="url(#arrowPink)"/>
    <line x1="894" y1="400" x2="902" y2="400" stroke="#f472b6" stroke-width="2" marker-end="url(#arrowPink)"/>
    <line x1="1014" y1="440" x2="1014" y2="454" stroke="#f472b6" stroke-width="2" marker-end="url(#arrowPink)"/>
    <line x1="904" y1="496" x2="896" y2="496" stroke="#f472b6" stroke-width="2" marker-end="url(#arrowPink)"/>
    <line x1="680" y1="496" x2="672" y2="496" stroke="#f472b6" stroke-width="2" marker-end="url(#arrowPink)"/>
    
    <text x="456" y="566" fill="#e2e8f0" font-size="13">収束後: レシピ生成 → Gemini の Google 検索で市販コスメを確認（確認できた商品のみバッジ）</text>
    <text x="456" y="590" fill="#e2e8f0" font-size="13">対話: 要望を Gemini が解釈 → 補正 → 再試着（要望文はデータとして扱い、指示には従わない）</text>
    <text x="456" y="614" fill="#e2e8f0" font-size="13">キーなし時: ルールベースの計画 + 比率モデルで評価（デモが止まらない）</text>

    <!-- Observability -->
    <rect x="440" y="646" width="700" height="96" rx="12" fill="#0c2235" stroke="#0ea5e9"/>
    <text x="456" y="672" font-weight="700" fill="#38bdf8">構造化ログ（Cloud Logging）</text>
    <text x="456" y="696" fill="#cbd5e1">Thought / Action / Observation / 評価スコア / ガバナンス検査を JSON で標準出力</text>
    <text x="456" y="720" fill="#cbd5e1">実行ごとに監査証明書（規程の適用状況・パラメータ・反復回数）を生成</text>
  </g>

  <!-- Cloud Run -> sponsors -->
  <line x1="1162" y1="300" x2="1198" y2="300" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1162" y1="580" x2="1198" y2="580" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ========== Gemini ========== -->
  <rect x="1200" y="120" width="360" height="330" rx="18" fill="#141633" stroke="#6366f1" stroke-width="2"/>
  <text x="1222" y="156" font-size="19" font-weight="700" fill="#c7d2fe">Gemini API</text>
  <text x="1222" y="180" font-size="13" fill="#a5b4fc">gemini-3.8-flash（google-genai SDK）</text>
  <g font-size="14">
    <rect x="1218" y="196" width="324" height="56" rx="10" fill="#1e2148"/>
    <text x="1232" y="220" font-weight="700" fill="#e0e7ff">計画・再計画（Planner）</text>
    <text x="1232" y="242" fill="#cbd5e1" font-size="13">7項目のパラメータを JSON で出力</text>
    <rect x="1218" y="260" width="324" height="56" rx="10" fill="#1e2148"/>
    <text x="1232" y="284" font-weight="700" fill="#a5f3fc">画像評価（Critic・マルチモーダル）</text>
    <text x="1232" y="306" fill="#cbd5e1" font-size="13">元画像と試着画像を比べ要素別に採点</text>
    <rect x="1218" y="324" width="324" height="56" rx="10" fill="#1e2148"/>
    <text x="1232" y="348" font-weight="700" fill="#e0e7ff">要望の解釈（Human-in-the-Loop）</text>
    <text x="1232" y="370" fill="#cbd5e1" font-size="13">「リップをナチュラルに」→ パラメータ</text>
    <rect x="1218" y="388" width="324" height="50" rx="10" fill="#1e2148"/>
    <text x="1232" y="418" font-weight="700" fill="#fde68a">Google Search Grounding（コスメ確認）</text>
  </g>

  <!-- ========== YouCam ========== -->
  <rect x="1200" y="470" width="360" height="290" rx="18" fill="#2a1220" stroke="#fb7185" stroke-width="2"/>
  <text x="1222" y="506" font-size="19" font-weight="700" fill="#fda4af">YouCam API（Perfect Corp）</text>
  <text x="1222" y="530" font-size="13" fill="#fecdd3">非同期タスク: アップロード → 実行 → 結果取得</text>
  <g font-size="14">
    <rect x="1218" y="546" width="324" height="56" rx="10" fill="#3a1a2b"/>
    <text x="1232" y="570" font-weight="700" fill="#fbcfe8">face-attr-analysis</text>
    <text x="1232" y="592" fill="#cbd5e1" font-size="13">顔の三分割比率（horizontalThird）</text>
    <rect x="1218" y="610" width="324" height="56" rx="10" fill="#3a1a2b"/>
    <text x="1232" y="634" font-weight="700" fill="#fbcfe8">hair-bang</text>
    <text x="1232" y="656" fill="#cbd5e1" font-size="13">前髪の試着（選んだ系統のテンプレート）</text>
    <rect x="1218" y="674" width="324" height="70" rx="10" fill="#3a1a2b"/>
    <text x="1232" y="698" font-weight="700" fill="#fbcfe8">makeup-vto</text>
    <text x="1232" y="720" fill="#cbd5e1" font-size="13">チーク・リップライナー・リップ・涙袋</text>
    <text x="1232" y="738" fill="#cbd5e1" font-size="12">（前髪の結果画像に重ねる・形状変形なし）</text>
  </g>

  <!-- ========== Governance footer ========== -->
  <rect x="40" y="782" width="1520" height="90" rx="16" fill="#071a14" stroke="#10b981"/>
  <text x="62" y="814" font-size="17" font-weight="700" fill="#34d399">ガバナンス規程</text>
  <g font-size="14" fill="#a7f3d0">
    <text x="62" y="846">N-G01 顔を採点しない（印象のシフトのみ評価）</text>
    <text x="440" y="846">N-G02 骨格・唇の形を変えない（上限内のメイクと前髪だけ）</text>
    <text x="880" y="846">N-G03 写真はアプリに保存しない（YouCam は最大24時間）</text>
    <text x="1290" y="846">N-G04 ループは最大3回</text>
  </g>
</svg>
