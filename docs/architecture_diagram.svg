      <!-- ツール群リスト -->
      <g transform="translate(15, 70)">
        <rect width="340" height="45" rx="8" fill="#1e1b4b" opacity="0.9" />
        <text x="12" y="28" font-family="sans-serif" font-size="11" fill="#fbcfe8">
          📐 analyze_face: 顔三分割比率 &amp; ランドマーク取得
        </text>
      </g>
      <g transform="translate(15, 125)">
        <rect width="340" height="45" rx="8" fill="#1e1b4b" opacity="0.9" />
        <text x="12" y="28" font-family="sans-serif" font-size="11" fill="#fbcfe8">
