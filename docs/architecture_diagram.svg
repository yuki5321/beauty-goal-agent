      </text>
      <text x="20" y="72" font-family="sans-serif" font-size="12" fill="#cbd5e1">
        • 骨格変形リミッター（AI_Face_Reshape等の歪曲ツール禁止・錯視ハードリミット制約）
      </text>
    </g>

    <!-- サブレイヤー 2: In-Memory Biometric Buffer -->
    <g transform="translate(30, 180)">
      <rect width="580" height="75" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="20" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c084fc">
        ② In-Memory Data Pipe (N-G03 生体データ保護)
      </text>
      <text x="20" y="50" font-family="sans-serif" font-size="12" fill="#cbd5e1">
        • Cloud RunのRAM（メモリ）上のみで画像処理 / ディスク・DBへの保存を全面禁止
      </text>
      <text x="20" y="68" font-family="sans-serif" font-size="11" fill="#a78bfa">
        • セッション終了時 / 300秒TTLでゼロフィル完全自動消去（プライバシー完全保護）
      </text>
    </g>

    <!-- サブレイヤー 3: Autonomous Agent Orchestrator (OODA Loop) -->
    <g transform="translate(30, 275)">
      <rect width="580" height="270" rx="18" fill="#0b1120" stroke="#f43f5e" stroke-width="2" />
      <text x="20" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fb7185">
        ③ Autonomous Agent Orchestrator (OODA &amp; Replan Loop)
      </text>
      
      <!-- OODAステップ -->
      <g transform="translate(20, 50)">
        <!-- Step 1 -->
        <rect x="0" y="0" width="125" height="85" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
        <text x="62" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Step 1: OBSERVE</text>
        <text x="10" y="46" font-family="sans-serif" font-size="10" fill="#e2e8f0">顔パーツ比率測定</text>
        <text x="10" y="64" font-family="sans-serif" font-size="9" fill="#94a3b8">中顔面比率 0.355</text>

        <!-- Step 2 -->
        <rect x="138" y="0" width="125" height="85" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
        <text x="200" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">Step 2: ORIENT</text>
        <text x="148" y="46" font-family="sans-serif" font-size="10" fill="#e2e8f0">Goalギャップ分析</text>
        <text x="148" y="64" font-family="sans-serif" font-size="9" fill="#94a3b8">縦重心要因を特定</text>

        <!-- Step 3 -->
        <rect x="276" y="0" width="125" height="85" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
        <text x="338" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f472b6" text-anchor="middle">Step 3: DECIDE</text>
        <text x="286" y="46" font-family="sans-serif" font-size="10" fill="#e2e8f0">スタイリング立案</text>
        <text x="286" y="64" font-family="sans-serif" font-size="9" fill="#94a3b8">Plan A 初期パラメータ</text>

        <!-- Step 4 -->
        <rect x="414" y="0" width="125" height="85" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="1" />
        <text x="476" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">Step 4: ACT</text>
        <text x="424" y="46" font-family="sans-serif" font-size="10" fill="#e2e8f0">YouCam MCP呼出</text>
        <text x="424" y="64" font-family="sans-serif" font-size="9" fill="#94a3b8">バーチャル試着合成</text>
      </g>

      <!-- Step 5 & 6 (下段) -->
      <g transform="translate(20, 150)">
        <!-- Step 5: EVALUATE -->
        <rect x="0" y="0" width="260" height="95" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
        <text x="20" y="26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399">Step 5: EVALUATE (Critic Agent)</text>
        <text x="20" y="48" font-family="sans-serif" font-size="11" fill="#e2e8f0">• Geminiマルチモーダル自己評価 (Score 72%)</text>
        <text x="20" y="68" font-family="sans-serif" font-size="10" fill="#f87171">• 批評:「チークが高く余白残存。涙袋シャドウ欠落」</text>
        <text x="20" y="85" font-family="sans-serif" font-size="10" fill="#facc15">• 判定: 目標未達 (閾値85%未満) → Replanへ</text>

        <!-- Step 6: REPLAN -->
        <rect x="276" y="0" width="263" height="95" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
        <text x="296" y="26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f472b6">Step 6: REPLAN (Plan B / 88%)</text>
        <text x="296" y="48" font-family="sans-serif" font-size="11" fill="#e2e8f0">• 反省を反映しチーク重心低下＋涙袋追加</text>
        <text x="296" y="68" font-family="sans-serif" font-size="11" fill="#34d399">• 再シミュレーション → Score 88% (達成！)</text>
        <text x="296" y="85" font-family="sans-serif" font-size="10" fill="#93c5fd">• サーキットブレーカー (最大3回制限) 適合</text>
      </g>
    </g>

    <!-- サブレイヤー 4: Observability & Cloud Logging -->
    <g transform="translate(30, 560)">
